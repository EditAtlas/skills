name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate.py --write-index
      - name: skills/index.json is up to date
        run: git diff --exit-code skills/index.json
      - run: python scripts/package.py

  signal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pillow  # the main scripts' own needs, so each one's --help runs under python -I
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg  # mix.py, check.py and measure.py run for real
      - run: python scripts/test_editatlas_signal.py

  project-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv, because setup-python has no 3.9 for the newest Ubuntu (2026-11-24) and the skill says Python 3.9+.
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg  # package.py build measures the test footage
      # jsonschema for the schema; OpenTimelineIO and its FCP XML adapter read the converters' files back.
      # convert.py itself needs neither.
      - run: uv run --no-project --python ${{ matrix.python-version }} --with jsonschema --with opentimelineio --with otio-fcp-adapter python scripts/test_project_format.py
