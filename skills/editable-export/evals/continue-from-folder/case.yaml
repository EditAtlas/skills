schema_version: "1.1"
name: continue-from-folder
expected_outcome: |
  Claude reads the person's version 2 in tweak.edit (package.py versions or changes, or versions/v2.json) and lists
  their changes: the title size 96 instead of 80 and the click 0.1 s later (0.6 s), with their note. It moves the
  title up on a copy of version 2, keeping the ids and the person's values, and saves that as version 3 with
  package.py save --from 2 and a note. It renders the final MP4 from tweak.edit with render.py and checks it. It does
  not start from work/project.json or its own version 1, makes no link, and invents no other change.
context:
  scaffold_script: place-files.sh
