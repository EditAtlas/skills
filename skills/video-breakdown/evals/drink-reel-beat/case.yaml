schema_version: "1.1"
name: drink-reel-beat
expected_outcome: |
  A breakdown of a 12 s vertical drink reel. It reports that the cuts follow the music's beat (about 103 BPM, cuts
  within 70 ms of a beat), that most cuts carry a bright flash frame, and that each shot carries one large word.
  The recipe is for the person's coffee shop with their own footage and music, and names EditAtlas techniques for
  the flash cut, cutting on the beat and the one-word text. It does not suggest reusing the reel's footage or music.
context:
  scaffold_script: place-files.sh
