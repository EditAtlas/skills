schema_version: "1.1"
name: cut-mistakes-en
expected_outcome: |
  A clean cut of a 54 s raw take, rendered to out/clean.mp4. Gone: a false start and the note "no, wait";
  a wrong try and "let me say that again"; the first "And the third" of a doubled phrase; "Um" and "Uh"; a whole
  closing line replaced after "Okay, one more time". Kept, unclipped and in order: the 13 lines the speaker meant,
  including "Keep the microphone close." (a lead-in the retake does not repeat), the "So" that means "therefore",
  and the deliberate "Never record too hot. Never." Long pauses shortened, no join without a breath, picture and
  sound in step. The reply names what was removed by its words and says nobody has listened yet.
context:
  scaffold_script: place-files.sh
---
tags: [talking-head-cut]
max_turns: 80
timeout_seconds: 3000
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
